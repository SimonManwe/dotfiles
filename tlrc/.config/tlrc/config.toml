[cache]
dir = "~/.cache/tlrc"
mirror = "https://github.com/tldr-pages/tldr/releases/latest/download"
auto_update = true
defer_auto_update = false
max_age = 336
languages = []

[output]
show_title = true
platform_title = false
show_hyphens = false
edit_link = false
example_prefix = "- "
line_length = 0
compact = false
option_style = "long"
raw_markdown = false

[indent]
title = 2
description = 2
bullet = 2
example = 4

[style.title]
color = { hex = "#cba6f7" }
bold = true

[style.description]
color = { hex = "#cdd6f4" }

[style.bullet]
color = { hex = "#a6e3a1" }

[style.example]
color = { hex = "#89b4fa" }

[style.url]
color = { hex = "#74c7ec" }
underline = true
italic = true

[style.inline_code]
color = { hex = "#f9e2af" }
italic = true

[style.placeholder]
color = { hex = "#f38ba8" }
italic = true
