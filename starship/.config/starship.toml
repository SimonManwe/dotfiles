add_newline = false
command_timeout = 300
palette = "catppuccin_mocha"

format = "$directory$git_branch$git_state$fill$rust$c$php$nodejs$line_break$character"

[fill]
symbol = " "

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = '../'
truncate_to_repo = true
home_symbol = "~/"
read_only = " read only"

[git_branch]
symbol = ""
format = "[on $symbol ]($style)[$branch(:$remote_branch)](red) "
style = "mauve"

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "peach"

# Toolchain Version for right display
[php]
format = '[ $version](mauve bold) '
[rust]
format = '[🦀$version](red bold) '
[nodejs]
format = '[ $version](bold green) ' 
[c]
format = '[󰙱$name $version]($style) '

[character]
success_symbol = "[➜](bold prompt_green)"
error_symbol = "[✗](bold red)"

