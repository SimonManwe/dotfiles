
set -g prefix C-s
bind x kill-pane

set -g mouse off

# Sensible settings
set -g history-limit 50000
set -g focus-events on      # nvim autoread / gitsigns refresh when switching panes
set -g display-time 2000
set -g status-interval 5
set -s escape-time 10 
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
set-option -g detach-on-destroy off

# Terminal Settings
set -g default-terminal "tmux-256color"
set -s extended-keys on
set -as terminal-features ",xterm-ghostty:RGB:usstyle:extkeys"
set -as terminal-features ",xterm-256color:RGB:usstyle"

# Options For Yazi Image Passthrough
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# copy mode for tmux
set -g set-clipboard on
set -as terminal-features ',xterm-ghostty:clipboard'

set -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

# make zsh the default shell
set-option -g default-shell /usr/bin/zsh

# window splits in currently open directory
bind % split-window -h -c "#{pane_current_path}"
bind \" split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# smart-splits.nvim: nvim reports itself via @pane-is-vim
# at_edge = split (keep in sync with move.at_edge in nvim smartsplits.lua)
bind -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { if -F '#{pane_at_left}'   { split-window -hb -c "#{pane_current_path}" } { select-pane -L } }
bind -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { if -F '#{pane_at_bottom}' { split-window -v  -c "#{pane_current_path}" } { select-pane -D } }
bind -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { if -F '#{pane_at_top}'    { split-window -vb -c "#{pane_current_path}" } { select-pane -U } }
bind -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { if -F '#{pane_at_right}'  { split-window -h  -c "#{pane_current_path}" } { select-pane -R } }

bind -n M-H if -F '#{@pane-is-vim}' { send-keys M-H } { resize-pane -L 3 }
bind -n M-J if -F '#{@pane-is-vim}' { send-keys M-J } { resize-pane -D 3 }
bind -n M-K if -F '#{@pane-is-vim}' { send-keys M-K } { resize-pane -U 3 }
bind -n M-L if -F '#{@pane-is-vim}' { send-keys M-L } { resize-pane -R 3 }

# copy mode: stop at the edge (a new pane would drop out of copy mode)
bind -T copy-mode-vi M-h if -F '#{pane_at_left}'   '' 'select-pane -L'
bind -T copy-mode-vi M-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -T copy-mode-vi M-k if -F '#{pane_at_top}'    '' 'select-pane -U'
bind -T copy-mode-vi M-l if -F '#{pane_at_right}'  '' 'select-pane -R'

# Reload tmux config
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

#gitlab ci popup
bind C display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "glab ci view"

# Screenshot
bind S run-shell "flameshot gui"

# bluetooth tui popup
bind-key b display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "bluetui"

# sesh
bind-key o display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh
bind L run-shell "sesh last"

# plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'p'

set -g @plugin 'AngryMorrocoy/tmux-neolazygit'
set -g @open-lazygit 'g'

# Configure the catppuccin plugin
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha
set -g @catppuccin_date_time_text " %H:%M"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Configure Floax
set -g @floax-session-name 'Floax-Scratch'
set -g @floax-border-color 'lightblue'
set -g @floax-text-color 'white'
set -g @floax-change-path 'false'

# run tpm
run '~/.tmux/plugins/tpm/tpm'

set -g popup-style "bg=default,fg=#cad3f5"
set -g popup-border-style "fg=#494d64"
set -g popup-border-lines rounded
